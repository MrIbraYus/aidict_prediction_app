name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: Migrations + RLS tests (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:test

  services:
    name: Data & prediction engine tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: services/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: pytest -m "not live"

  prototype:
    name: Prototype build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: prototype } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: prototype/package-lock.json }
      - run: npm ci
      - run: npm run build

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
