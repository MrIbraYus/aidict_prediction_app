name: Walk-forward backtest

on:
  workflow_dispatch:
    inputs:
      leagues: { description: "Competition codes", default: "PL BL1", required: true }
  schedule:
    - cron: "0 4 * * 1" # weekly retrain + backtest (Mon 04:00 UTC)

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: services/pyproject.toml }
      - run: pip install -e .
      - run: python scripts/run_backtest.py --leagues ${{ github.event.inputs.leagues || 'PL BL1' }}
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            documentation/BACKTEST_RESULTS.md
            services/.cache/backtest-*.csv
          retention-days: 90
