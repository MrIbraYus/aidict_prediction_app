<!doctype html>
<html lang="en" data-aidict-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0D0D" />
    <link rel="icon" type="image/png" href="./brand/aidict-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://crests.football-data.org" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>AIDICT · Prototype</title>
    <script>
      (function () {
        var choice = 'dark'
        try { choice = localStorage.getItem('aidict.theme') || 'dark' } catch (e) {}
        var dark = choice === 'system' ? !window.matchMedia('(prefers-color-scheme: light)').matches : choice !== 'light'
        document.documentElement.setAttribute('data-aidict-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
